services:
  - type: web
    name: crowdlog-monthly-report
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python web_app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: HOST
        value: 0.0.0.0
      - key: OPEN_BROWSER
        value: 0
